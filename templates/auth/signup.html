{% extends "base.html" %}
{% block title %}Create Account | AI Career Mentor{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; background: var(--accent-gradient); color: #FFF; font-size: 1.6rem; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);">
        🎓
      </div>
      <h2 style="font-size: 1.65rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">
        Create Account
      </h2>
      <p style="color: var(--text-muted); font-size: 0.92rem;">
        Start your personalized AI career preparation journey.
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.signup') }}">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Arun Kumar" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">College / Personal Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="arun@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Create Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-type password" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; font-weight: 700;">
        Create Account ➔
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" style="font-weight: 700; color: var(--primary); margin-left: 4px;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
